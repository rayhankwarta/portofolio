<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#0C0E12" />
  
  <!-- Editorial Grid Background -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#1E232D" stroke-width="1" />
  <line x1="60" y1="130" x2="740" y2="130" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="60" y1="200" x2="740" y2="200" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="60" y1="270" x2="740" y2="270" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="60" y1="340" x2="740" y2="340" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="60" y1="380" x2="740" y2="380" stroke="#1E232D" stroke-width="1" />

  <line x1="60" y1="60" x2="60" y2="380" stroke="#1E232D" stroke-width="1" />
  <line x1="430" y1="60" x2="430" y2="380" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
