    <text x="10" y="18" fill="#94A3B8" font-family="monospace" font-size="8">ASTORIA</text>
    <text x="10" y="34" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="700">$232.2K</text>
    <text x="10" y="45" fill="#3B82F6" font-family="monospace" font-size="8">Weekend Peak</text>
