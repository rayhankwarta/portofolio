  <rect x="351" y="335" width="16" height="25" rx="2" fill="#1E293B" />
  <!-- 7pm -->
  <rect x="374" y="345" width="16" height="15" rx="2" fill="#0F172A" />

  <!-- Trend Curve Line over bars -->
  <path d="M 83 315 Q 120 180 152 140 T 205 220 T 290 260 T 382 345" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" />

