  <text x="152" y="372" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="8" font-weight="700">9A</text>
  <text x="221" y="372" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="8">12P</text>
