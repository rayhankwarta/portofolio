  <rect x="144" y="140" width="16" height="220" rx="2" fill="#FBBF24" />
  <!-- 10am Peak -->
  <rect x="167" y="170" width="16" height="190" rx="2" fill="#F59E0B" />
  <!-- 11am -->
  <rect x="190" y="240" width="16" height="120" rx="2" fill="#3B82F6" />
