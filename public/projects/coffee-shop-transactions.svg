  <text x="460" y="270" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="600">STORE LOCATION BENCHMARKS</text>

  <g transform="translate(460, 282)">
    <rect width="80" height="52" rx="4" fill="#1E1E2E" stroke="#334155" stroke-width="1" />
    <text x="10" y="18" fill="#94A3B8" font-family="monospace" font-size="8">LOWER MANH.</text>
    <text x="10" y="34" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="700">$230.4K</text>
    <text x="10" y="45" fill="#10B981" font-family="monospace" font-size="8">Highest ATV</text>
  </g>

  <g transform="translate(548, 282)">
    <rect width="80" height="52" rx="4" fill="#1E1E2E" stroke="#334155" stroke-width="1" />
    <text x="10" y="18" fill="#94A3B8" font-family="monospace" font-size="8">HELL'S KITCHEN</text>
    <text x="10" y="34" fill="#F8FAFC" font-family="monospace" font-size="11" font-weight="700">$236.5K</text>
    <text x="10" y="45" fill="#F59E0B" font-family="monospace" font-size="8">Top Volume</text>
  </g>

  <g transform="translate(636, 282)">
