  <g transform="translate(60, 415)">
    <text x="0" y="14" fill="#94A3B8" font-family="monospace" font-size="10">AGGREGATION:</text>
    <text x="110" y="14" fill="#E2E8F0" font-family="monospace" font-size="10">TOTAL ROWS: <tspan fill="#F59E0B">149,116</tspan></text>
    <text x="260" y="14" fill="#E2E8F0" font-family="monospace" font-size="10">STORES: <tspan fill="#38BDF8">3 NYC HUBS</tspan></text>
    <text x="400" y="14" fill="#E2E8F0" font-family="monospace" font-size="10">CORE PAIR: <tspan fill="#10B981">COFFEE &amp; TEA (68%)</tspan></text>
    <text x="600" y="14" fill="#E2E8F0" font-family="monospace" font-size="10">AVG BASKET: <tspan fill="#FBBF24">1.44 ITEMS</tspan></text>
