  <rect x="213" y="220" width="16" height="140" rx="2" fill="#3B82F6" />
  <!-- 1pm -->
  <rect x="236" y="250" width="16" height="110" rx="2" fill="#1E3A8A" />
  <!-- 2pm -->
  <rect x="259" y="280" width="16" height="80" rx="2" fill="#1E3A8A" />
  <!-- 3pm Afternoon Rush -->
  <rect x="282" y="260" width="16" height="100" rx="2" fill="#3B82F6" />
  <!-- 4pm -->
  <rect x="305" y="295" width="16" height="65" rx="2" fill="#1E293B" />
  <!-- 5pm -->
  <rect x="328" y="320" width="16" height="40" rx="2" fill="#1E293B" />
