<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#0C0E12" />
  <!-- Editorial Grid Background -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#1E232D" stroke-width="1" />
  <line x1="60" y1="120" x2="740" y2="120" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="60" y1="180" x2="740" y2="180" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="60" y1="240" x2="740" y2="240" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="60" y1="300" x2="740" y2="300" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="60" y1="360" x2="740" y2="360" stroke="#1E232D" stroke-width="1" />

  <line x1="60" y1="60" x2="60" y2="360" stroke="#1E232D" stroke-width="1" />
  <line x1="400" y1="60" x2="400" y2="360" stroke="#1E232D" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="740" y1="60" x2="740" y2="360" stroke="#1E232D" stroke-width="1" />

  <!-- Title / Label -->
  <text x="60" y="44" fill="#64748B" font-family="monospace" font-size="11" letter-spacing="1.5">FIG 01 // UJI KOMPETENSI: STUDENT STRESS CLASSIFIER (N=2,100)</text>
  <text x="740" y="44" text-anchor="end" fill="#3B82F6" font-family="monospace" font-size="11" font-weight="600">RANDOM FOREST ACCURACY: 89.0%</text>

  <!-- Left: Feature Importance Horizontal Bars -->
  <text x="60" y="86" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="600">FEATURE IMPORTANCE (GINI WEIGHTS)</text>

  <!-- Bar 1: Blood Pressure (14.5%) -->
  <text x="60" y="116" fill="#CBD5E1" font-family="monospace" font-size="10">Blood Pressure</text>
  <rect x="200" y="104" width="170" height="15" rx="3" fill="#1E3A8A" />
  <rect x="200" y="104" width="145" height="15" rx="3" fill="#3B82F6" />
  <text x="352" y="116" fill="#93C5FD" font-family="monospace" font-size="10" font-weight="600">14.5%</text>

  <!-- Bar 2: Sleep Quality (8.1%) -->
  <text x="60" y="148" fill="#CBD5E1" font-family="monospace" font-size="10">Sleep Quality</text>
  <rect x="200" y="136" width="170" height="15" rx="3" fill="#1E3A8A" />
  <rect x="200" y="136" width="81" height="15" rx="3" fill="#60A5FA" />
  <text x="288" y="148" fill="#93C5FD" font-family="monospace" font-size="10" font-weight="600">8.1%</text>

  <!-- Bar 3: Teacher-Student Rel (7.1%) -->
  <text x="60" y="180" fill="#CBD5E1" font-family="monospace" font-size="10">Teacher-Student</text>
  <rect x="200" y="168" width="170" height="15" rx="3" fill="#1E3A8A" />
  <rect x="200" y="168" width="71" height="15" rx="3" fill="#60A5FA" />
  <text x="278" y="180" fill="#93C5FD" font-family="monospace" font-size="10" font-weight="600">7.1%</text>

  <!-- Bar 4: Academic Performance (6.6%) -->
  <text x="60" y="212" fill="#CBD5E1" font-family="monospace" font-size="10">Academic Perf</text>
  <rect x="200" y="200" width="170" height="15" rx="3" fill="#1E3A8A" />
  <rect x="200" y="200" width="66" height="15" rx="3" fill="#93C5FD" />
  <text x="273" y="212" fill="#93C5FD" font-family="monospace" font-size="10" font-weight="600">6.6%</text>

  <!-- Bar 5: Basic Needs (6.6%) -->
  <text x="60" y="244" fill="#CBD5E1" font-family="monospace" font-size="10">Basic Needs</text>
  <rect x="200" y="232" width="170" height="15" rx="3" fill="#1E3A8A" />
  <rect x="200" y="232" width="66" height="15" rx="3" fill="#93C5FD" />
  <text x="273" y="244" fill="#93C5FD" font-family="monospace" font-size="10" font-weight="600">6.6%</text>

  <!-- Right: Stress Category Multi-class Distribution & Confusion Matrix Mini-Grid -->
  <text x="440" y="86" fill="#94A3B8" font-family="monospace" font-size="10" font-weight="600">CLASSIFICATION COHORTS &amp; RECALL</text>

  <!-- High Stress Tier -->
  <g transform="translate(440, 104)">
    <rect width="280" height="42" rx="4" fill="#1E1E2E" stroke="#EF4444" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="21" r="6" fill="#EF4444" />
    <text x="36" y="20" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="600">HIGH STRESS TIER</text>
    <text x="36" y="33" fill="#94A3B8" font-family="monospace" font-size="9">Severe Psychosocial Burden</text>
    <text x="264" y="26" text-anchor="end" fill="#FCA5A5" font-family="monospace" font-size="12" font-weight="700">91% RECALL</text>
  </g>

  <!-- Medium Stress Tier -->
  <g transform="translate(440, 156)">
    <rect width="280" height="42" rx="4" fill="#1E1E2E" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="21" r="6" fill="#F59E0B" />
    <text x="36" y="20" fill="#FDE68A" font-family="monospace" font-size="11" font-weight="600">MEDIUM STRESS TIER</text>
    <text x="36" y="33" fill="#94A3B8" font-family="monospace" font-size="9">Moderate Study Load Friction</text>
    <text x="264" y="26" text-anchor="end" fill="#FDE68A" font-family="monospace" font-size="12" font-weight="700">93% RECALL</text>
  </g>

  <!-- Low Stress Tier -->
  <g transform="translate(440, 208)">
    <rect width="280" height="42" rx="4" fill="#1E1E2E" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="21" r="6" fill="#10B981" />
    <text x="36" y="20" fill="#A7F3D0" font-family="monospace" font-size="11" font-weight="600">LOW STRESS TIER</text>
    <text x="36" y="33" fill="#94A3B8" font-family="monospace" font-size="9">Balanced Sleep &amp; Support</text>
    <text x="264" y="26" text-anchor="end" fill="#A7F3D0" font-family="monospace" font-size="12" font-weight="700">84% RECALL</text>
  </g>

  <!-- Callout Badge in Middle -->
  <rect x="60" y="290" width="660" height="50" rx="6" fill="#172554" stroke="#3B82F6" stroke-width="1" />
  <text x="80" y="312" fill="#93C5FD" font-family="monospace" font-size="11" font-weight="600">CROSS-DATASET SYNTHESIS (1,100 MONITORING + 1,000 LIFESTYLE RECORDS)</text>
  <text x="80" y="328" fill="#DBEAFE" font-family="monospace" font-size="10">Sleep duration &lt;6 hrs &amp; low teacher support correlate with a 2.4x elevation in high stress risk.</text>
  <text x="700" y="322" text-anchor="end" fill="#60A5FA" font-family="monospace" font-size="12" font-weight="700">F1: 89%</text>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 395)">
    <text x="0" y="14" fill="#64748B" font-family="monospace" font-size="10">PIPELINE DOMAINS:</text>
    <rect x="120" y="2" width="115" height="18" fill="#1E3A8A" rx="2" />
    <text x="177" y="15" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="9">PHYSIOLOGICAL</text>

    <rect x="245" y="2" width="115" height="18" fill="#1E293B" rx="2" />
    <text x="302" y="15" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">PSYCHOSOCIAL</text>

    <rect x="370" y="2" width="115" height="18" fill="#1E293B" rx="2" />
    <text x="427" y="15" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">LIFESTYLE / SLEEP</text>

    <rect x="495" y="2" width="125" height="18" fill="#1E293B" rx="2" />
    <text x="557" y="15" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">ACADEMIC EXAM</text>

    <rect x="630" y="2" width="90" height="18" fill="#065F46" rx="2" />
    <text x="675" y="15" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="9">RANDOM FOREST</text>
  </g>
</svg>
