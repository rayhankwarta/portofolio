  <!-- Historical Actual Line -->
  <path d="M 60 270 L 120 250 L 180 280 L 240 220 L 300 240 L 370 190 L 440 210" stroke="#94A3B8" stroke-width="2.5" fill="none" />
  
  <!-- Forecast Trend Line -->
  <path d="M 440 210 C 500 195, 620 160, 740 145" stroke="#A855F7" stroke-width="3" fill="none" />

  <!-- Trend seasonal waves -->
  <path d="M 440 210 L 490 180 L 540 215 L 590 165 L 640 195 L 690 140 L 740 165" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />

  <!-- Nodes -->
  <circle cx="240" cy="220" r="4" fill="#94A3B8" />
  <circle cx="370" cy="190" r="4" fill="#94A3B8" />
  <circle cx="440" cy="210" r="6" fill="#8B5CF6" stroke="#0C0E12" stroke-width="2" />
  <circle cx="590" cy="165" r="4" fill="#C084FC" />
  <circle cx="690" cy="140" r="5" fill="#E9D5FF" />

