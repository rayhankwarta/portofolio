<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#0C0E12" />
  <!-- Editorial Grid Background -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#1E232D" stroke-width="1" />
  <line x1="60" y1="360" x2="740" y2="360" stroke="#1E232D" stroke-width="1" />
  
  <text x="60" y="44" fill="#64748B" font-family="monospace" font-size="11" letter-spacing="1.5">FIG 02 // LOGISTICS TRANSIT TIME DISTRIBUTION &amp; BOTTLENECK ANALYSIS</text>
  <text x="740" y="44" text-anchor="end" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">SLA BREACH: -23.1%</text>

  <!-- Network Routes Graphic -->
  <!-- Hub 1: Jakarta -->
  <circle cx="140" cy="180" r="14" fill="#064E3B" stroke="#10B981" stroke-width="2" />
  <circle cx="140" cy="180" r="4" fill="#10B981" />
  <text x="140" y="215" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="600">HUB-01 (JKT)</text>
  <text x="140" y="230" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">DISPATCH: 98.4%</text>

  <!-- Transfer Hub 2: Semarang -->
  <circle cx="340" cy="140" r="18" fill="#450A0A" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="340" cy="140" r="6" fill="#EF4444" />
  <text x="340" y="180" text-anchor="middle" fill="#FCA5A5" font-family="monospace" font-size="11" font-weight="600">HUB-02 (SMG)</text>
  <text x="340" y="195" text-anchor="middle" fill="#EF4444" font-family="monospace" font-size="9">BOTTLENECK DETECTED</text>

  <!-- Transfer Hub 3: Surabaya -->
  <circle cx="520" cy="220" r="14" fill="#064E3B" stroke="#10B981" stroke-width="2" />
  <circle cx="520" cy="220" r="4" fill="#10B981" />
  <text x="520" y="255" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="600">HUB-03 (SUB)</text>
  <text x="520" y="270" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">DISPATCH: 95.1%</text>

  <!-- Destination Hub 4: Denpasar -->
  <circle cx="680" cy="170" r="14" fill="#064E3B" stroke="#10B981" stroke-width="2" />
  <circle cx="680" cy="170" r="4" fill="#10B981" />
  <text x="680" y="205" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="600">HUB-04 (DPS)</text>
  <text x="680" y="220" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">ARRIVAL: ON-TIME</text>

  <!-- Flow Lines -->
  <!-- Route 1 to 2 (Delayed) -->
  <path d="M 154 175 L 322 143" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 4" />
  <rect x="210" y="142" width="75" height="18" rx="2" fill="#2A0B0B" stroke="#EF4444" stroke-width="1" />
  <text x="247" y="155" text-anchor="middle" fill="#FCA5A5" font-family="monospace" font-size="9">+4.8h DELAY</text>

  <!-- Alternate Optimized Route (Bypass) -->
  <path d="M 154 185 C 300 290, 400 260, 506 224" stroke="#10B981" stroke-width="2.5" />
  <rect x="300" y="280" width="130" height="20" rx="3" fill="#064E3B" stroke="#10B981" stroke-width="1" />
  <text x="365" y="294" text-anchor="middle" fill="#A7F3D0" font-family="monospace" font-size="9" font-weight="600">RE-ROUTED DIRECT // -3.2h</text>

  <!-- Route 3 to 4 -->
  <path d="M 534 216 L 666 174" stroke="#10B981" stroke-width="2" />

  <!-- Histogram summary at bottom -->
  <g transform="translate(60, 385)">
    <rect x="0" y="8" width="18" height="24" fill="#1E293B" rx="2" />
    <rect x="22" y="4" width="18" height="28" fill="#1E293B" rx="2" />
    <rect x="44" y="0" width="18" height="32" fill="#065F46" rx="2" />
    <rect x="66" y="2" width="18" height="30" fill="#059669" rx="2" />
    <rect x="88" y="7" width="18" height="25" fill="#10B981" rx="2" />
    <rect x="110" y="16" width="18" height="16" fill="#1E293B" rx="2" />
    <rect x="132" y="22" width="18" height="10" fill="#7F1D1D" rx="2" />
    <text x="170" y="22" fill="#94A3B8" font-family="monospace" font-size="10">MEAN LEAD-TIME REDUCED FROM 42.6h → 32.8h (N=45,000)</text>
  </g>
</svg>
